name: Release

# Pushing a v* tag builds the plugin zip from exactly the files .distignore lets
# through and publishes it as a GitHub release. The zip is what users download
# and what the Playground blueprint installs, so it is built here from a clean
# checkout rather than on a maintainer's machine, where a dirty working tree is
# how test reports and videos end up in a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  # Creating the release and uploading its asset.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here runs an authenticated git command; gh reads GH_TOKEN.
          persist-credentials: false

      # WordPress reads the version from three places and they drift silently:
      # the header decides what wp-admin shows, the constant busts asset caches
      # and Elementor's element cache, and Stable tag decides what wordpress.org
      # serves. A tag that disagrees with any of them is refused before anything
      # is published.
      - name: Check the tag matches every version field
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' custom-digits-for-elementor-counter.php)
          CONSTANT=$(sed -nE "s/.*define\( 'CUSTOM_DIGITS_COUNTER_VERSION', '([^']+)' \).*/\1/p" custom-digits-for-elementor-counter.php)
          STABLE=$(sed -nE 's/^Stable tag:[[:space:]]*([^[:space:]]+).*/\1/p' readme.txt)
          echo "tag=$TAG header=$HEADER constant=$CONSTANT stable=$STABLE"
          for v in "$HEADER" "$CONSTANT" "$STABLE"; do
            if [ "$v" != "$TAG" ]; then
              echo "::error::tag v$TAG does not match plugin versions (header $HEADER, constant $CONSTANT, readme Stable tag $STABLE)"
              exit 1
            fi
          done

      # wp dist-archive is the tool .distignore is written for, and the one the
      # Plugin Check action's README recommends for building a clean plugin.
      # It runs on WP-CLI but needs no WordPress install.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      # Installed with Composer from Packagist, not `wp package install`. The
      # latest stable WP-CLI (2.12) bundles Composer 2.2, which rejects the token
      # format GitHub Actions now issues ("contains invalid characters",
      # composer/composer#12076). setup-php writes that token into Composer's
      # auth.json, so `wp package install` fails reading it. The Composer
      # setup-php installs accepts it. Requiring the package pulls WP-CLI in as
      # a dependency, and its vendor/bin/wp registers dist-archive through the
      # autoloader.
      #
      # Pinned: dist-archive 3.2.x requires WP-CLI 2.13, which has no stable
      # release yet. 3.1.0 accepts any WP-CLI 2.x. Move the pin once 2.13 ships.
      - name: Install wp dist-archive
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/wp-cli"
          composer require --working-dir="${RUNNER_TEMP}/wp-cli" --no-interaction --no-progress \
            wp-cli/dist-archive-command:3.1.0
          "${RUNNER_TEMP}/wp-cli/vendor/bin/wp" --version

      # --plugin-dirname fixes the directory inside the zip to the plugin slug:
      # WordPress names the installed plugin after it, and Playground installs
      # from this zip. Without it, the name would come from the checkout
      # directory. The asset name carries no version so that
      # releases/latest/download/custom-digits-for-elementor-counter.zip always
      # resolves to the newest release. The zip is written outside the checkout
      # so it cannot end up inside itself.
      - name: Build the plugin zip
        run: |
          set -euo pipefail
          SLUG=custom-digits-for-elementor-counter
          "${RUNNER_TEMP}/wp-cli/vendor/bin/wp" dist-archive . "${RUNNER_TEMP}/${SLUG}.zip" --plugin-dirname="${SLUG}" --force
          echo "Files in the release zip:"
          unzip -Z1 "${RUNNER_TEMP}/${SLUG}.zip" | sort
          unzip -Z1 "${RUNNER_TEMP}/${SLUG}.zip" | grep -qx "${SLUG}/${SLUG}.php" \
            || { echo "::error::zip has no ${SLUG}/${SLUG}.php"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "${RUNNER_TEMP}/custom-digits-for-elementor-counter.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Custom Digits for Elementor Counter ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
