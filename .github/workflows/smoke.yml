name: Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: WordPress + Elementor
    runs-on: ubuntu-latest
    # Booting wp-env from cold pulls Docker images, WordPress, Elementor and the
    # theme. Generous, but bounded: a hung Docker pull must not run for hours.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow runs an authenticated git command, so the
          # token does not need to stay on disk where a dependency install
          # script could read it.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Docker is preinstalled on ubuntu-latest, so wp-env needs no setup beyond
      # this. Recorded in the log because a Docker or Compose upgrade on the
      # runner image is a plausible cause of a previously green run failing.
      - name: Report Docker version
        run: |
          docker --version
          docker compose version

      # Elementor and Hello Elementor come from the wordpress.org zip URLs in
      # .wp-env.json, downloaded fresh: a runner has no cached environment to
      # reuse, so this also exercises the cold-start path.
      - name: Run smoke test
        run: npm run test:smoke

      # The captured HTML, debug.log, wp-env log and state.json are the only way
      # to diagnose a CI-only failure, so keep them even when the job fails.
      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-output
          path: tests/smoke/output/
          retention-days: 7
          if-no-files-found: warn
