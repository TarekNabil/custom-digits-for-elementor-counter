name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    # 8.5 is tested for early warning of upstream deprecations, but must not
    # turn the repository red: PHPUnit 9.6 is pinned by the 7.4 platform floor
    # and is not guaranteed to support the newest PHP.
    continue-on-error: ${{ matrix.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor declared in the plugin header; every release from
        # there up is covered so a deprecation cannot reach users unseen.
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
        include:
          - php: '8.3'
            coverage: true
          - php: '8.5'
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this workflow runs an authenticated git command, so the
          # token does not need to stay on disk where a dependency install
          # script could read it.
          persist-credentials: false

      # PCOV rather than Xdebug: it is several times faster and this suite only
      # needs line coverage. mbstring is installed so Digits::character_length
      # exercises its mb_strlen path, as it will on almost every real host.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        if: ${{ ! matrix.coverage }}
        run: composer test

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: composer test:coverage

      # Skipped when no token is available. Dependabot runs and pull requests
      # from forks are denied repository secrets by design, so the token is
      # empty there and Codecov refuses a tokenless upload to a protected
      # branch. A dependency bump does not change coverage, so skipping is
      # correct — failing the job would just train everyone to ignore red.
      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/clover.xml
          flags: php
          name: phpunit-php8.3
          # Where a token IS present, a failed upload must be visible rather
          # than leaving a silently stale badge.
          fail_ci_if_error: true

  jest:
    name: Jest
    runs-on: ubuntu-latest

    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing in this workflow runs an authenticated git command, so the
          # token does not need to stay on disk where a dependency install
          # script could read it.
          persist-credentials: false

      # Active LTS. Node only runs the test tooling here: no build step ships
      # anything, so this version never affects the plugin's own JavaScript.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      # See the note on the PHPUnit upload: skipped without a token.
      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/js/lcov.info
          flags: js
          name: jest
          fail_ci_if_error: true
